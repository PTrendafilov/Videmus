<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="340" height="200">

  <!-- The V shape — solid dark blue -->
  <path d="M 60 22 L 170 162 L 280 22"
        fill="none"
        stroke="#1E3A8A"
        stroke-width="40"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Road center dashes — left arm -->
  <line x1="64" y1="30" x2="166" y2="148"
        stroke="white" stroke-width="2.5" stroke-dasharray="13,10"
        stroke-linecap="round"/>

  <!-- Road center dashes — right arm -->
  <line x1="276" y1="30" x2="174" y2="148"
        stroke="white" stroke-width="2.5" stroke-dasharray="13,10"
        stroke-linecap="round"/>

  <!-- Top-down car silhouette -->
  <g>
    <rect x="164" y="153" width="12" height="20" rx="4" fill="white"/>
    <rect x="161" y="157" width="3" height="4" rx="1" fill="white"/>
    <rect x="176" y="157" width="3" height="4" rx="1" fill="white"/>
  </g>
</svg>
