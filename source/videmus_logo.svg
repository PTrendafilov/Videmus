<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 285" width="340" height="285">

  <!-- The V shape — solid dark blue, no gradient -->
  <path d="M 60 22 L 170 162 L 280 22"
        fill="none"
        stroke="#1E3A8A"
        stroke-width="40"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Road center dashes — left arm (white cutouts) -->
  <line x1="64" y1="30" x2="166" y2="148"
        stroke="white" stroke-width="2.5" stroke-dasharray="13,10"
        stroke-linecap="round"/>

  <!-- Road center dashes — right arm (white cutouts) -->
  <line x1="276" y1="30" x2="174" y2="148"
        stroke="white" stroke-width="2.5" stroke-dasharray="13,10"
        stroke-linecap="round"/>

  <!-- Top-down car silhouette at the vanishing point (white cutout) -->
  <g>
    <!-- Car body -->
    <rect x="164" y="153" width="12" height="20" rx="4" fill="white"/>
    <!-- Left mirror -->
    <rect x="161" y="157" width="3" height="4" rx="1" fill="white"/>
    <!-- Right mirror -->
    <rect x="176" y="157" width="3" height="4" rx="1" fill="white"/>
  </g>

  <!-- Thin horizontal separator line -->
  <line x1="95" y1="190" x2="245" y2="190"
        stroke="#1E3A8A" stroke-width="0.8" opacity="0.4"/>

  <!-- VIDEMUS wordmark -->
  <text x="170" y="227"
        text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="800"
        font-size="40"
        fill="#1E3A8A"
        letter-spacing="8">VIDEMUS</text>

  <!-- Tagline -->
  <text x="170" y="255"
        text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="300"
        font-size="11"
        fill="#1E3A8A"
        letter-spacing="4"
        opacity="0.55">WE GUIDE THE DRIVER</text>
</svg>
